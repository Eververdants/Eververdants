name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"  # 每天执行
  workflow_dispatch:

# The default token is read-only now; without this the push to `output`
# fails with "Permission to ... denied to github-actions[bot]".
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        id: snake-gif
        with:
          github_user_name: Eververdants
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#6f9e2f&color_dots=#ebedf0,#d6eea0,#aadc5c,#79b62a,#4f8a12
            dist/github-contribution-grid-snake-dark.svg?color_snake=#c6ff4d&color_dots=#21262d,#3b4a1e,#6f9e2f,#9bd23c,#c6ff4d

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
